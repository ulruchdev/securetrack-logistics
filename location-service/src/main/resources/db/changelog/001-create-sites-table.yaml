databaseChangeLog:
  - changeSet:
      id: 1-create-sites-table
      author: cbs-logistics
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: sites
      changes:
        - createTable:
            tableName: sites
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: VARCHAR(500)
              - column:
                  name: latitude
                  type: DOUBLE PRECISION
              - column:
                  name: longitude
                  type: DOUBLE PRECISION
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - createIndex:
            tableName: sites
            indexName: idx_sites_tenant_id
            columns:
              - column:
                  name: tenant_id
