# ============================================================
#  CBS Logistics API - Spec combinée (FICHIER GÉNÉRÉ - ne pas éditer à la main)
#
#  Sources : package-service-openapi.yaml, location-service-openapi.yaml,
#            security-checkpoint-service-openapi.yaml, tracking-service-openapi.yaml
#  Régénération : python3 docs/generate-combined-openapi.py
# ============================================================
openapi: 3.0.3
info:
  title: CBS Logistics API
  version: 1.0.0
  description: API combinée pour le système CBS Logistics incluant Package Service, Location Service, Security Checkpoint
    Service et Tracking Service.
servers:
- url: http://localhost:8081
  description: Package Service
- url: http://localhost:8082
  description: Location Service
- url: http://localhost:8083
  description: Security Checkpoint Service
- url: http://localhost:8084
  description: Tracking Service
paths:
  /api/packages:
    post:
      summary: Créer un colis
      description: Créer un nouveau colis dans le système
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePackageRequest'
      responses:
        '201':
          description: Colis créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDto'
        '400':
          description: Erreur de validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      servers:
      - url: http://localhost:8081
        description: Package Service
      tags:
      - Package Service
    get:
      summary: Lister les colis
      description: Récupérer tous les colis avec pagination et tri
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          default: 10
      - name: sortBy
        in: query
        schema:
          type: string
          default: packageId
      - name: sortDir
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        '200':
          description: Liste des colis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePackageDto'
      servers:
      - url: http://localhost:8081
        description: Package Service
      tags:
      - Package Service
  /api/packages/{id}:
    get:
      summary: Récupérer un colis
      description: Récupérer un colis par son ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Détails du colis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDto'
        '404':
          description: Colis non trouvé
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      servers:
      - url: http://localhost:8081
        description: Package Service
      tags:
      - Package Service
    patch:
      summary: Mettre à jour un colis
      description: Mise à jour partielle d'un colis
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePackageRequest'
      responses:
        '200':
          description: Colis mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDto'
        '404':
          description: Colis non trouvé
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      servers:
      - url: http://localhost:8081
        description: Package Service
      tags:
      - Package Service
    delete:
      summary: Supprimer un colis
      description: Supprimer un colis du système
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Colis supprimé avec succès
        '404':
          description: Colis non trouvé
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      servers:
      - url: http://localhost:8081
        description: Package Service
      tags:
      - Package Service
  /api/locations:
    post:
      summary: Créer une location
      description: Créer un nouvel emplacement logistique
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationRequest'
      responses:
        '201':
          description: Location créée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationDto'
        '400':
          description: Erreur de validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Service externe indisponible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      servers:
      - url: http://localhost:8082
        description: Location Service
      tags:
      - Location Service
    get:
      summary: Lister les locations
      description: Récupérer toutes les locations avec pagination
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: Liste des locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageLocationDto'
      servers:
      - url: http://localhost:8082
        description: Location Service
      tags:
      - Location Service
  /api/locations/{id}:
    get:
      summary: Récupérer une location
      description: Récupérer une location par son ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Détails de la location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationDto'
        '404':
          description: Location non trouvée
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      servers:
      - url: http://localhost:8082
        description: Location Service
      tags:
      - Location Service
  /api/locations/by-package/{packageId}:
    get:
      summary: Location enrichie par colis
      description: Récupérer une location avec les informations du colis associé
      parameters:
      - name: packageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Location avec informations du colis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichedLocationDto'
        '404':
          description: Location non trouvée pour ce colis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Service externe indisponible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      servers:
      - url: http://localhost:8082
        description: Location Service
      tags:
      - Location Service
  /api/checkpoints:
    post:
      summary: Enregistrer un passage
      description: Créer un nouveau log de passage de colis au checkpoint
      tags:
      - Security Checkpoint Service
      - Checkpoint Logs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckpointRequest'
      responses:
        '201':
          description: Passage enregistré avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointLogDto'
        '401':
          description: Authentification requise - identifiants absents ou invalides
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '400':
          description: Erreur de validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Localisation non trouvée
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Checkpoint non disponible OU localisation rattachée à un autre colis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Service externe indisponible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      servers:
      - url: http://localhost:8083
        description: Security Checkpoint Service
      security: &id001
      - basicAuth: []
    get:
      summary: Lister les logs
      description: Lister tous les passages avec pagination
      tags:
      - Security Checkpoint Service
      - Checkpoint Logs
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: Liste des logs de checkpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCheckpointLogDto'
        '401':
          description: Authentification requise - identifiants absents ou invalides
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      servers:
      - url: http://localhost:8083
        description: Security Checkpoint Service
      security: *id001
  /api/checkpoints/{id}:
    get:
      summary: Consulter un log
      description: Récupérer les détails d'un passage spécifique
      tags:
      - Security Checkpoint Service
      - Checkpoint Logs
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Détails du log de checkpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointLogDto'
        '401':
          description: Authentification requise - identifiants absents ou invalides
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Log de checkpoint non trouvé
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      servers:
      - url: http://localhost:8083
        description: Security Checkpoint Service
      security: *id001
  /api/checkpoints/by-package/{packageId}:
    get:
      summary: Logs par colis
      description: Voir tous les checkpoints par lesquels un colis est passé (traçabilité)
      tags:
      - Security Checkpoint Service
      - Checkpoint Logs
      parameters:
      - name: packageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Historique des passages du colis (paginé)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCheckpointLogDto'
        '401':
          description: Authentification requise - identifiants absents ou invalides
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Aucun passage trouvé pour ce colis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      servers:
      - url: http://localhost:8083
        description: Security Checkpoint Service
      security: *id001
  /api/tracking:
    post:
      summary: Enregistrer une transition de statut
      description: 'Enregistre un changement de statut pour un colis.

        La transition est validée par l''aggregate (invariants métier) :

        - Statuts autorisés : NEW, IN_TRANSIT, DELIVERED, LOST

        - DELIVERED et LOST sont des états terminaux (aucune transition possible après)

        - Retourne 409 si la transition est interdite

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTransitionRequest'
      responses:
        '201':
          description: Transition enregistrée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterTransitionResponse'
        '400':
          description: Erreur de validation (champs manquants ou JSON invalide)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Transition invalide (règle métier violée)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Authentification requise (Basic Auth)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Erreur interne inattendue
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      servers:
      - url: http://localhost:8084
        description: Tracking Service
      tags:
      - Tracking Service
      security: &id002
      - basicAuth: []
  /api/tracking/package/{packageId}:
    get:
      summary: Historique des transitions d'un colis
      description: 'Retourne la liste complète des transitions de statut pour un colis donné,

        ordonnées chronologiquement (de la plus ancienne à la plus récente).

        '
      parameters:
      - name: packageId
        in: path
        required: true
        schema:
          type: string
        description: Identifiant du colis
      responses:
        '200':
          description: Liste des transitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransitionDto'
        '401':
          description: Authentification requise (Basic Auth)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Erreur interne inattendue
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      servers:
      - url: http://localhost:8084
        description: Tracking Service
      tags:
      - Tracking Service
      security: *id002
  /api/tracking/{trackingId}:
    get:
      summary: Consulter une transition par son identifiant
      description: Retourne les détails d'une transition spécifique.
      parameters:
      - name: trackingId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Identifiant de la transition
      responses:
        '200':
          description: Transition trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionDto'
        '404':
          description: Transition introuvable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Authentification requise (Basic Auth)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Erreur interne inattendue
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      servers:
      - url: http://localhost:8084
        description: Tracking Service
      tags:
      - Tracking Service
      security: *id002
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'Authentification Basic HTTP. Credentials : admin / (voir SECURITY_PASSWORD)

        '
  schemas:
    PackageDto:
      type: object
      properties:
        packageId:
          type: integer
          format: int64
        description:
          type: string
        packageName:
          type: string
        packageType:
          type: string
        weight:
          type: number
          format: double
        fragile:
          type: boolean
        packageStatus:
          $ref: '#/components/schemas/PackageStatus'
    CreatePackageRequest:
      type: object
      required:
      - description
      - packageName
      - packageType
      - weight
      - fragile
      properties:
        description:
          type: string
          minLength: 1
        packageName:
          type: string
          minLength: 1
        packageType:
          type: string
          minLength: 1
        weight:
          type: number
          format: double
          minimum: 0
        fragile:
          type: boolean
    UpdatePackageRequest:
      type: object
      properties:
        description:
          type: string
        packageName:
          type: string
        packageType:
          type: string
        weight:
          type: number
          format: double
          minimum: 0
        fragile:
          type: boolean
        packageStatus:
          $ref: '#/components/schemas/PackageStatus'
    PackageStatus:
      type: string
      enum:
      - NEW
      - IN_TRANSIT
      - DELIVERED
      - LOST
    PagePackageDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PackageDto'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
    ProblemDetail:
      type: object
      description: Réponse d'erreur au format RFC 7807 (application/problem+json)
      properties:
        type:
          type: string
          description: URI identifiant le type de problème (about:blank si non spécifié)
        title:
          type: string
          description: Titre court et lisible du problème
        status:
          type: integer
          format: int32
          description: Code de statut HTTP
        detail:
          type: string
          description: Explication détaillée du problème
        instance:
          type: string
          description: URI de l'instance concernée
    LocationDto:
      type: object
      properties:
        locationId:
          type: string
        packageId:
          type: integer
          format: int64
        city:
          type: string
        zone:
          type: string
        checkpointAvailable:
          type: boolean
    CreateLocationRequest:
      type: object
      required:
      - city
      - zone
      - checkpointAvailable
      - packageId
      properties:
        city:
          type: string
          minLength: 1
        zone:
          type: string
          minLength: 1
        checkpointAvailable:
          type: boolean
        packageId:
          type: integer
          format: int64
    EnrichedLocationDto:
      type: object
      properties:
        location:
          $ref: '#/components/schemas/LocationDto'
        packageInfo:
          $ref: '#/components/schemas/PackageInfo'
    PackageInfo:
      type: object
      properties:
        packageId:
          type: integer
          format: int64
        description:
          type: string
        packageName:
          type: string
        packageType:
          type: string
        weight:
          type: number
          format: double
        fragile:
          type: boolean
        packageStatus:
          type: string
          enum:
          - NEW
          - IN_TRANSIT
          - DELIVERED
          - LOST
    PageLocationDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/LocationDto'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
    CheckpointLogDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        packageId:
          type: integer
          format: int64
        locationId:
          type: string
        checkpointTime:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/CheckpointResult'
        comment:
          type: string
        createdBy:
          type: string
    CreateCheckpointRequest:
      type: object
      required:
      - packageId
      - locationId
      - result
      - createdBy
      properties:
        packageId:
          type: integer
          format: int64
        locationId:
          type: string
          minLength: 1
        checkpointTime:
          type: string
          format: date-time
          description: Optionnel, auto-généré si non fourni
        result:
          $ref: '#/components/schemas/CheckpointResult'
        comment:
          type: string
        createdBy:
          type: string
          minLength: 1
    CheckpointResult:
      type: string
      enum:
      - OK
      - REFUSED
      - ALERT
      - PENDING
      description: 'Résultats possibles:

        * OK - Contrôle réussi

        * REFUSED - Colis refusé

        * ALERT - Alerte détectée

        * PENDING - En attente de validation

        '
    PageCheckpointLogDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CheckpointLogDto'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
    RegisterTransitionRequest:
      type: object
      required:
      - packageId
      - newStatus
      properties:
        packageId:
          type: string
          description: Identifiant du colis
          example: PKG-001
        locationId:
          type: string
          description: Identifiant de la localisation (optionnel)
          example: '1'
        newStatus:
          type: string
          description: Nouveau statut du colis
          enum:
          - NEW
          - IN_TRANSIT
          - DELIVERED
          - LOST
    RegisterTransitionResponse:
      type: object
      properties:
        packageId:
          type: string
          description: Identifiant du colis
        status:
          type: string
          description: Statut enregistré
    TransitionDto:
      type: object
      properties:
        trackingId:
          type: integer
          format: int64
          description: Identifiant unique de la transition
        packageId:
          type: string
          description: Identifiant du colis
        locationId:
          type: string
          description: Identifiant de la localisation
        status:
          type: string
          description: Statut du colis après transition
        occurredAt:
          type: string
          format: date-time
          description: Horodatage de la transition (UTC)
