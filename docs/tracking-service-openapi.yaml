openapi: 3.0.3
info:
  title: Tracking Service API
  version: 1.0.0
  description: >
    API pour le suivi des transitions de statut des colis.
    Implémente CQRS + Event Sourcing via Axon Framework.
    Chaque écriture (POST) est un événement immuable dans l'event store ;
    chaque lecture (GET) interroge une projection dédiée (tracking_history).
servers:
  - url: http://localhost:8084
    description: Tracking Service

paths:
  /api/tracking:
    post:
      summary: Enregistrer une transition de statut
      description: |
        Enregistre un changement de statut pour un colis.
        La transition est validée par l'aggregate (invariants métier) :
        - Statuts autorisés : NEW, IN_TRANSIT, DELIVERED, LOST
        - DELIVERED et LOST sont des états terminaux (aucune transition possible après)
        - Retourne 409 si la transition est interdite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTransitionRequest'
      responses:
        '201':
          description: Transition enregistrée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterTransitionResponse'
        '400':
          description: Erreur de validation (champs manquants ou JSON invalide)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Transition invalide (règle métier violée)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Erreur interne inattendue
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/tracking/package/{packageId}:
    get:
      summary: Historique des transitions d'un colis
      description: |
        Retourne la liste complète des transitions de statut pour un colis donné,
        ordonnées chronologiquement (de la plus ancienne à la plus récente).
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: string
          description: Identifiant du colis
      responses:
        '200':
          description: Liste des transitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransitionDto'
        '500':
          description: Erreur interne inattendue
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/tracking/{trackingId}:
    get:
      summary: Consulter une transition par son identifiant
      description: Retourne les détails d'une transition spécifique.
      parameters:
        - name: trackingId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Identifiant de la transition
      responses:
        '200':
          description: Transition trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionDto'
        '404':
          description: Transition introuvable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Erreur interne inattendue
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  schemas:
    RegisterTransitionRequest:
      type: object
      required:
        - packageId
        - newStatus
      properties:
        packageId:
          type: string
          description: Identifiant du colis
          example: "PKG-001"
        locationId:
          type: string
          description: Identifiant de la localisation (optionnel)
          example: "1"
        newStatus:
          type: string
          description: Nouveau statut du colis
          enum:
            - NEW
            - IN_TRANSIT
            - DELIVERED
            - LOST

    RegisterTransitionResponse:
      type: object
      properties:
        packageId:
          type: string
          description: Identifiant du colis
        status:
          type: string
          description: Statut enregistré

    TransitionDto:
      type: object
      properties:
        trackingId:
          type: integer
          format: int64
          description: Identifiant unique de la transition
        packageId:
          type: string
          description: Identifiant du colis
        locationId:
          type: string
          description: Identifiant de la localisation
        status:
          type: string
          description: Statut du colis après transition
        occurredAt:
          type: string
          format: date-time
          description: Horodatage de la transition (UTC)

    ProblemDetail:
      type: object
      description: Réponse d'erreur au format RFC 7807 (application/problem+json)
      properties:
        type:
          type: string
          description: URI identifiant le type de problème (about:blank si non spécifié)
        title:
          type: string
          description: Titre court et lisible du problème
        status:
          type: integer
          format: int32
          description: Code de statut HTTP
        detail:
          type: string
          description: Explication détaillée du problème
        instance:
          type: string
          description: URI de l'instance concernée
