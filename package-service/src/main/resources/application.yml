server:
  port: 8081

spring:
  application:
    name: package-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cbsdb}
    username: ${DB_USERNAME:cbsuser}
    password: ${DB_PASSWORD}   # OBLIGATOIRE : le service refuse de démarrer sans la variable DB_PASSWORD
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none   # Le schéma est géré par Liquibase (db/changelog/db.changelog-master.yaml)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:cbsuser}
    password: ${RABBITMQ_PASSWORD}

logging:
  level:
    com.cbs.logistics.package_service: INFO
# ── JWT Resource Server ──
jwt:
  secret: ${JWT_SECRET:cbs-dev-secret-key-must-be-replaced-in-prod}
  # En prod, utiliser jwt.jwk-set-uri: https://idp.example.com/realms/cbs/protocol/openid-connect/certs
