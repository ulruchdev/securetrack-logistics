server:
  port: 8081

spring:
  application:
    name: package-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cbsdb}
    username: ${DB_USERNAME:cbsuser}
    password: ${DB_PASSWORD}   # OBLIGATOIRE : le service refuse de démarrer sans la variable DB_PASSWORD
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE   # Affiche les valeurs bindées
    com.cbs.logistics.package_service: INFO