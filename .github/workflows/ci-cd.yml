name: CI/CD SecureTrack Logistics

# ============================================================
#  Déclencheur ÉVOLUTIF : aucune branche hardcodée
#  - push : tous les pushs (main, develop, feature/*, etc.)
#  - pull_request : TOUTE PR, quelle que soit la branche cible
# ============================================================
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # ──────────────────────────────────────────────────────────
  #  STAGE 1 : Build + Tests unitaires (< 5 min)
  #  Se déclenche sur CHAQUE PR et chaque push
  # ──────────────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: securetrack
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: GitGuardian Secret Scanning
        uses: GitGuardian/ggshield-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      - name: Maven Build & Tests
        run: mvn clean verify -B --no-transfer-progress

      - name: Python tests + coverage
        run: |
          pip install coverage --quiet
          cd docs && python3 -m coverage run -m unittest test_generate_combined_openapi
          python3 -m coverage report --include='*/generate-combined-openapi.py' --fail-under=80

  # ──────────────────────────────────────────────────────────
  #  STAGE 2 : Docker Build (< 5 min)
  #  Valide les Dockerfiles + dépendances sans lancer les apps
  # ──────────────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build all Docker images
        run: |
          docker build -t cbs-package -f package-service/Dockerfile .
          docker build -t cbs-location -f location-service/Dockerfile .
          docker build -t cbs-checkpoint -f security-checkpoint-service/Dockerfile .
          docker build -t cbs-tracking -f tracking-service/Dockerfile .
          docker build -t cbs-gateway -f gateway-service/Dockerfile .
          echo "5 images Docker buildees avec succes"

  # ──────────────────────────────────────────────────────────
  #  STAGE 3 : Integration Smoke Test
  #  Se déclenche UNIQUEMENT sur push vers main/master/develop
  #  (pas sur les PRs — trop lent et coûteux pour chaque PR)
  # ──────────────────────────────────────────────────────────
  integration-smoke-test:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v4

      - name: Generate JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV

      - name: Docker Compose up (full stack)
        env:
          POSTGRES_PASSWORD: testpassword
          MONGO_PASSWORD: testpassword
          REDIS_PASSWORD: testpassword
          RABBITMQ_PASSWORD: testpassword
          JWT_SECRET: ${{ env.JWT_SECRET }}
          SECURITY_PASSWORD: testpassword
        run: |
          # Créer le .env pour docker-compose
          cp common/.env.example common/.env
          sed -i 's/<changez-moi>/testpassword/g' common/.env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$JWT_SECRET|" common/.env

          # Démarrer infrastructure + apps
          docker compose --profile full up -d --build

          # Attendre que TOUS les services soient healthy (max 120s)
          echo "Attente des health checks..."
          timeout 120 bash -c '
            while true; do
              HEALTHY=$(docker compose ps --format json 2>/dev/null | grep -c "\"Health\":\"healthy\"" || true)
              TOTAL=$(docker compose ps --format json 2>/dev/null | wc -l || true)
              echo "  Services: $HEALTHY/$TOTAL healthy"
              if [ "$HEALTHY" -ge 5 ]; then
                echo "Tous les services sont healthy"
                break
              fi
              sleep 5
            done
          '

          # Vérifier l'état final
          docker compose ps
          echo "---"

      - name: Smoke test — Package Service
        run: |
          curl -sf http://localhost:8081/actuator/health || exit 1
          echo "Package Service: OK"

      - name: Smoke test — Location Service
        run: |
          curl -sf http://localhost:8082/actuator/health || exit 1
          echo "Location Service: OK"

      - name: Smoke test — Security Checkpoint
        run: |
          curl -sf http://localhost:8083/actuator/health || exit 1
          echo "Security Checkpoint: OK"

      - name: Smoke test — Tracking Service
        run: |
          curl -sf http://localhost:8084/actuator/health || exit 1
          echo "Tracking Service: OK"

      - name: Smoke test — Gateway
        run: |
          curl -sf http://localhost:8080/actuator/health || exit 1
          echo "Gateway: OK"

      - name: Cleanup
        if: always()
        run: docker compose --profile full down -v
