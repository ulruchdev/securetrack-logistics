name: CI/CD SecureTrack Logistics

on:
  push:
    branches: [ develop, main, master, import-local-cbs-pr-fixed ]
  pull_request:
    branches: [ develop, main, import-local-cbs-pr-fixed ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: securetrack
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: GitGuardian Secret Scanning (sécurité obligatoire)
        uses: GitGuardian/ggshield-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      - name: Maven Build & Tests (tests réels - doivent passer)
        run: mvn clean verify -B --no-transfer-progress

      - name: Tests Python + couverture (generate-combined-openapi.py)
        run: |
          pip install coverage --quiet
          cd docs && python3 -m coverage run -m unittest test_generate_combined_openapi
          # Le module est chargé via importlib (nom de fichier avec tirets) :
          # on cible le fichier dans le rapport au lieu du nom de module.
          python3 -m coverage report --include='*/generate-combined-openapi.py' --fail-under=80

      # La revue de code est assurée par l'application GitHub CodeRabbit (action ci-pr-reviewer retirée du marketplace)

      - name: Build Docker images (5 services)
        run: |
          docker build -t cbs-package -f package-service/Dockerfile .
          docker build -t cbs-location -f location-service/Dockerfile .
          docker build -t cbs-checkpoint -f security-checkpoint-service/Dockerfile .
          docker build -t cbs-tracking -f tracking-service/Dockerfile .
          docker build -t cbs-gateway -f gateway-service/Dockerfile .
          echo "✅ 5 images Docker buildées"

      - name: Generate JWT secret for smoke test
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV

      - name: Docker Compose smoke test
        env:
          POSTGRES_PASSWORD: testpassword
          MONGO_PASSWORD: testpassword
          REDIS_PASSWORD: testpassword
          RABBITMQ_PASSWORD: testpassword
          JWT_SECRET: ${{ env.JWT_SECRET }}
          SECURITY_PASSWORD: testpassword
        run: |
          cp common/.env.example common/.env
          sed -i 's/<changez-moi>/testpassword/g' common/.env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$JWT_SECRET/" common/.env
          docker compose up -d
          sleep 20
          docker compose ps
          docker compose down
