databaseChangeLog:
  - changeSet:
      id: 2-add-tenant-id
      author: cbs-logistics
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: checkpoint_logs
        - not:
            - columnExists:
                tableName: checkpoint_logs
                columnName: tenant_id
      changes:
        - addColumn:
            tableName: checkpoint_logs
            columns:
              - column:
                  name: tenant_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addDefaultValue:
            tableName: checkpoint_logs
            columnName: tenant_id
            defaultValue: 'default'
        - createIndex:
            tableName: checkpoint_logs
            indexName: idx_checkpoint_tenant_id
            columns:
              - column:
                  name: tenant_id
