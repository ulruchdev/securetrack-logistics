server:
  port: 8083

spring:
  application:
    name: security-checkpoint-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cbsdb}
    username: ${DB_USERNAME:cbsuser}
    password: ${DB_PASSWORD}   # OBLIGATOIRE : le service refuse de demarrer sans la variable DB_PASSWORD
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none   # Le schema est gere par Liquibase (db/changelog/db.changelog-master.yaml)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis : cache de disponibilite des checkpoints (voir RedisCacheConfig)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      # Desactive le scan des repositories Redis (nos entites sont JPA, pas RedisHash)
      repositories:
        enabled: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.cbs.logistics.security_checkpoint_service: INFO
    org.springframework.cloud.openfeign: DEBUG

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: basic

resilience4j:
  circuitbreaker:
    instances:
      locationService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
  retry:
    instances:
      locationService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - feign.RetryableException
          - com.cbs.logistics.security_checkpoint_service.exception.LocationServiceUnavailableException

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    circuitbreakers:
      enabled: true
    circuitbreakerevents:
      enabled: true

# JWT Resource Server
jwt:
  secret: ${JWT_SECRET}

# URL du Location Service (surchargeable par variable d'environnement LOCATION_SERVICE_URL)
location-service:
  url: ${LOCATION_SERVICE_URL:http://localhost:8082}

# URL du Package Service (surchargeable par variable d'environnement PACKAGE_SERVICE_URL)
package-service:
  url: ${PACKAGE_SERVICE_URL:http://localhost:8081}
