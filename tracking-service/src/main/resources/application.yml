server:
  port: 8084

spring:
  application:
    name: tracking-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cbsdb}
    username: ${DB_USERNAME:cbsuser}
    password: ${DB_PASSWORD}   # OBLIGATOIRE : le service refuse de démarrer sans DB_PASSWORD
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none   # Le schéma est géré par Liquibase (projection) et Axon (tables axon_*)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    com.cbs.logistics.tracking_service: INFO
