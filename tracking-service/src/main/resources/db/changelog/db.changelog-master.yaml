databaseChangeLog:
  # =====================================================================
  # CBS Logistics - Tracking Service
  # Migration initiale : table de PROJECTION "tracking_history"
  #
  # Rôle de cette table : c'est le READ-MODEL CQRS.
  #   - Elle est remplie automatiquement par les @EventHandler d'Axon
  #     (jamais par une écriture manuelle).
  #   - Elle sert uniquement aux lectures (GET /api/tracking/**).
  #   - Les tables axon_* (event store) sont créées par Axon lui-même,
  #     elles ne sont PAS gérées ici — séparation des responsabilités.
  # =====================================================================
  - changeSet:
      id: 1-init-tracking-history-table
      author: cbs-logistics
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: tracking_history
      changes:
        - createTable:
            tableName: tracking_history
            columns:
              - column:
                  name: tracking_id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: package_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: location_id
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false

        # Index de lecture : la requête principale est
        # "historique complet d'un colis" -> filtrage par package_id
        - createIndex:
            indexName: idx_tracking_history_package_id
            tableName: tracking_history
            columns:
              - column:
                  name: package_id
